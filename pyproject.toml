[project]
name = "cmyk-preview"
version = "1.0.0"
description = "Preview PDFs with one or more missing CMYK printer inks."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.116.1",
    "pillow==11.3.0",
    "pymupdf==1.26.3",
    "python-multipart==0.0.20",
    "reportlab==4.4.3",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.2",
]

[tool.uv]
package = false

[tool.ruff]
indent-width = 4
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
